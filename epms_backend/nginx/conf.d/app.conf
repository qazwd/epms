#----------------------------------------------------------
server {
    listen 80;
    # server_name localhost;  # 或你的域名

    # 根路径指向静态HTML文件
    location / {
        root /home/app/staticfiles;  # 对应docker-compose中nginx挂载的static_volume路径
        try_files $uri $uri/ /企业项目管理系统.html;  # 优先匹配文件，否则返回指定HTML
    }

    # 静态文件处理（如CSS、JS、图片等）
    location /static/ {
        alias /home/app/staticfiles/;
    }

    # 反向代理Django接口请求
    location /api/ {
        proxy_pass http://web:8000;  # 转发到Django的web服务
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 反向代理Django admin
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

}
